name: PR CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Install browser for workspace qualification
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Qualify workspace at root and /app
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 5198 --strictPort > /tmp/stupen-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          node -e 'const u="http://127.0.0.1:5198"; for(let n=0;n<100;n++){try{if((await fetch(u)).ok)process.exit(0)}catch{} await new Promise(r=>setTimeout(r,100))}process.exit(1)'
          BASE=http://127.0.0.1:5198 node scripts/verify-editor.ts
          kill "$preview_pid"
          wait "$preview_pid" || true
          BASE_PATH=/app pnpm build
          BASE_PATH=/app node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 5198 --strictPort > /tmp/stupen-preview.log 2>&1 &
          preview_pid=$!
          node -e 'const u="http://127.0.0.1:5198/app/"; for(let n=0;n<100;n++){try{if((await fetch(u)).ok)process.exit(0)}catch{} await new Promise(r=>setTimeout(r,100))}process.exit(1)'
          BASE=http://127.0.0.1:5198/app node scripts/verify-editor.ts
      - name: Real local and remote practice sandbox integration
        run: |
          docker build -t stupen-practice-fixture:ci -f scripts/practice-fixture.Dockerfile .
          docker run --rm --privileged --network none \
            -e PRACTICE_INTEGRATION=1 \
            -v "$PWD:/workspace:ro" -w /workspace \
            stupen-practice-fixture:ci node --test server/practice-run.test.ts

  ci-gate:
    name: CI gate
    if: always()
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          assert set(results) == {"verify"}, results
          for name, result in results.items():
              assert result["result"] == "success", name + " did not pass"
          PY
